<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Odwołania — Mokotown Music Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/szkola/szkola.css">
</head>
<body>
  <div id="mmHeader"></div>
  <main class="mm-main">
    <div class="mm-page-head">
      <h1>Odwołania i odrabianie</h1>
      <p>Dziennik odwołanych lekcji: kto, kiedy, i co z tym dalej.</p>
    </div>

    <section class="mm-card" id="nowe" style="margin-bottom:1.25rem">
      <h2 id="formTitle">Odwołana lekcja</h2>
      <form class="mm-form" id="cancelForm">
        <input type="hidden" name="id">
        <label>Data lekcji<input name="lesson_date" type="date" required></label>
        <label>Godzina<input name="lesson_time" type="time"></label>
        <label>Uczeń<input name="student_name" required placeholder="imię i nazwisko"></label>
        <label>Nauczyciel<select name="teacher_id" id="teacherSel"></select></label>
        <label>Długość<select name="duration_min"><option value="30">30 min</option><option value="45" selected>45 min</option><option value="60">60 min</option></select></label>
        <label>Odwołał<select name="cancelled_by" id="bySel"></select></label>
        <label>Status<select name="status" id="statusSel"></select></label>
        <label>Termin odrobienia<input name="makeup_date" type="date"></label>
        <label class="wide">Powód<input name="reason" placeholder="choroba, wyjazd…"></label>
        <label class="wide">Notatki<textarea name="notes"></textarea></label>
        <div class="actions">
          <button type="button" class="mm-btn mm-btn--ghost" id="cancelEdit" hidden>Anuluj</button>
          <button type="submit" class="mm-btn" id="saveBtn">Zapisz odwołanie</button>
        </div>
      </form>
    </section>

    <section class="mm-card">
      <div class="mm-toolbar">
        <input class="mm-input" id="search" placeholder="Szukaj ucznia…">
        <select class="mm-input" id="filterStatus">
          <option value="do_odrobienia">Do odrobienia</option>
          <option value="all">Wszystkie</option>
          <option value="odrobiona">Odrobione</option>
          <option value="zwrot">Zwroty</option>
          <option value="przepada">Przepadłe</option>
        </select>
        <div class="spacer"></div>
        <span class="mm-muted" id="countLabel"></span>
      </div>
      <div class="mm-table-wrap">
        <table class="mm-table">
          <thead><tr><th>Lekcja</th><th>Uczeń</th><th>Nauczyciel</th><th>Odwołał</th><th>Status</th><th>Odrobienie</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="7" class="mm-empty">Ładowanie…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/vendor/supabase-js-2.39.3.min.js"></script>
  <script type="module">
    import { initSzkola, supabase, run, esc, badge, options, fmtDate, formData, nullIfEmpty, todayISO, loadTeachers, LABELS } from '/szkola/szkola.js';

    const state = await initSzkola('odwolania');
    if (state) {
      const form = document.getElementById('cancelForm');
      const rows = document.getElementById('rows');
      const filterStatus = document.getElementById('filterStatus');
      const search = document.getElementById('search');
      document.getElementById('bySel').innerHTML = options(LABELS.cancelled_by, 'uczen');
      document.getElementById('statusSel').innerHTML = options(LABELS.cancel_status, 'do_odrobienia');
      form.elements.lesson_date.value = todayISO();

      const teachers = await loadTeachers();
      const teacherSel = document.getElementById('teacherSel');
      teacherSel.innerHTML = '<option value="">—</option>' + teachers.filter(t => t.is_active).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');

      let all = [];

      async function load() {
        all = (await run(supabase.from('lesson_cancellations').select('*, teachers(name)').order('lesson_date', { ascending: false }).limit(500))) || [];
        render();
      }

      function render() {
        const q = search.value.trim().toLowerCase();
        const f = filterStatus.value;
        const list = all.filter(c => (f === 'all' || c.status === f) && (!q || `${c.student_name} ${c.teachers?.name || ''} ${c.reason || ''}`.toLowerCase().includes(q)));
        document.getElementById('countLabel').textContent = `${list.length} z ${all.length}`;
        rows.innerHTML = list.length ? list.map(c => `
          <tr data-id="${c.id}">
            <td style="white-space:nowrap">${fmtDate(c.lesson_date)}${c.lesson_time ? ' ' + c.lesson_time.slice(0, 5) : ''}<div class="mm-muted">${c.duration_min} min</div></td>
            <td><strong>${esc(c.student_name)}</strong>${c.reason ? `<div class="mm-muted">${esc(c.reason)}</div>` : ''}${c.notes ? `<div class="mm-muted">${esc(c.notes)}</div>` : ''}</td>
            <td>${esc(c.teachers?.name || '')}</td>
            <td>${esc(LABELS.cancelled_by[c.cancelled_by] || c.cancelled_by)}</td>
            <td><select class="mm-input" data-act="status">${options(LABELS.cancel_status, c.status)}</select></td>
            <td><input type="date" class="mm-input" data-act="makeup" value="${c.makeup_date || ''}"></td>
            <td class="row-actions"><button class="mm-btn mm-btn--ghost mm-btn--sm" data-act="edit">Edytuj</button> <button class="mm-btn mm-btn--danger mm-btn--sm" data-act="del">Usuń</button></td>
          </tr>`).join('') : '<tr><td colspan="7" class="mm-empty">Nic w tym widoku.</td></tr>';
      }

      rows.addEventListener('change', async (e) => {
        const id = e.target.closest('tr')?.dataset.id; if (!id) return;
        if (e.target.dataset.act === 'status') {
          if (await run(supabase.from('lesson_cancellations').update({ status: e.target.value }).eq('id', id).select().single(), 'Status zapisany')) await load();
        }
        if (e.target.dataset.act === 'makeup') {
          const makeup_date = nullIfEmpty(e.target.value);
          const patch = makeup_date ? { makeup_date, status: 'odrobiona' } : { makeup_date };
          if (await run(supabase.from('lesson_cancellations').update(patch).eq('id', id).select().single(), 'Termin zapisany')) await load();
        }
      });

      rows.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-act]'); if (!btn) return;
        const id = btn.closest('tr').dataset.id;
        const c = all.find(x => x.id === id);
        if (btn.dataset.act === 'edit') {
          for (const k of ['lesson_date', 'lesson_time', 'student_name', 'teacher_id', 'duration_min', 'cancelled_by', 'status', 'makeup_date', 'reason', 'notes']) form.elements[k].value = c[k] ?? '';
          form.elements.id.value = id;
          document.getElementById('formTitle').textContent = `Edycja: ${c.student_name}, ${fmtDate(c.lesson_date)}`;
          document.getElementById('saveBtn').textContent = 'Zapisz zmiany';
          document.getElementById('cancelEdit').hidden = false;
          form.scrollIntoView({ behavior: 'smooth' });
        }
        if (btn.dataset.act === 'del' && confirm('Usunąć ten wpis?')) {
          if (await run(supabase.from('lesson_cancellations').delete().eq('id', id), 'Usunięto')) await load();
        }
      });

      function resetForm() {
        form.reset();
        form.elements.id.value = '';
        form.elements.lesson_date.value = todayISO();
        document.getElementById('formTitle').textContent = 'Odwołana lekcja';
        document.getElementById('saveBtn').textContent = 'Zapisz odwołanie';
        document.getElementById('cancelEdit').hidden = true;
      }
      document.getElementById('cancelEdit').addEventListener('click', resetForm);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const d = formData(form);
        const id = d.id;
        const payload = {
          lesson_date: d.lesson_date, lesson_time: nullIfEmpty(d.lesson_time), student_name: d.student_name,
          teacher_id: nullIfEmpty(d.teacher_id), duration_min: Number(d.duration_min), cancelled_by: d.cancelled_by,
          status: d.status, makeup_date: nullIfEmpty(d.makeup_date), reason: nullIfEmpty(d.reason), notes: nullIfEmpty(d.notes),
        };
        const q = id ? supabase.from('lesson_cancellations').update(payload).eq('id', id) : supabase.from('lesson_cancellations').insert(payload);
        if (await run(q.select().single(), id ? 'Zapisano' : 'Odwołanie zapisane')) { resetForm(); await load(); }
      });

      search.addEventListener('input', render);
      filterStatus.addEventListener('change', render);
      await load();
    }
  </script>
</body>
</html>
