<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Leady — Mokotown Music Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/szkola/szkola.css">
</head>
<body>
  <div id="mmHeader"></div>
  <main class="mm-main">
    <div class="mm-page-head">
      <h1>Leady</h1>
      <p>Zapytania o lekcje, zanim trafią do ActiveNow.</p>
    </div>

    <section class="mm-card" id="nowy" style="margin-bottom:1.25rem">
      <h2 id="formTitle">Nowy lead</h2>
      <form class="mm-form" id="leadForm">
        <input type="hidden" name="id">
        <label>Imię i nazwisko<input name="name" required placeholder="np. Anna Kowalska (mama Zosi)"></label>
        <label>Telefon<input name="phone" type="tel"></label>
        <label>E-mail<input name="email" type="email"></label>
        <label>Instrument<input name="instrument" placeholder="gitara, pianino, wokal…"></label>
        <label>Wiek ucznia<input name="student_age" type="number" min="1" max="99"></label>
        <label>Źródło<select name="source" id="sourceSel"></select></label>
        <label>Status<select name="status" id="statusSel"></select></label>
        <label>Następny kontakt<input name="next_action_at" type="date"></label>
        <label>Preferowane dni / godziny<input name="preferred_days" placeholder="wt/czw po 16"></label>
        <label class="wide">Notatki<textarea name="notes"></textarea></label>
        <div class="actions">
          <button type="button" class="mm-btn mm-btn--ghost" id="cancelEdit" hidden>Anuluj</button>
          <button type="submit" class="mm-btn" id="saveBtn">Dodaj leada</button>
        </div>
      </form>
    </section>

    <section class="mm-card">
      <div class="mm-toolbar">
        <input class="mm-input" id="search" placeholder="Szukaj…">
        <select class="mm-input" id="filterStatus">
          <option value="">Aktywne (bez zapisanych i rezygnacji)</option>
          <option value="all">Wszystkie</option>
        </select>
        <div class="spacer"></div>
        <span class="mm-muted" id="countLabel"></span>
      </div>
      <div class="mm-table-wrap">
        <table class="mm-table">
          <thead><tr><th>Osoba</th><th>Instrument</th><th>Źródło</th><th>Status</th><th>Następny kontakt</th><th>Dodano</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="7" class="mm-empty">Ładowanie…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/vendor/supabase-js-2.39.3.min.js"></script>
  <script type="module">
    import { initSzkola, supabase, run, esc, badge, options, fmtDate, formData, nullIfEmpty, toast, LABELS } from '/szkola/szkola.js';

    const state = await initSzkola('leady');
    if (state) {
      const form = document.getElementById('leadForm');
      const rows = document.getElementById('rows');
      const filterStatus = document.getElementById('filterStatus');
      const search = document.getElementById('search');
      document.getElementById('sourceSel').innerHTML = options(LABELS.lead_source, 'telefon');
      document.getElementById('statusSel').innerHTML = options(LABELS.lead_status, 'nowy');
      for (const [v, l] of Object.entries(LABELS.lead_status)) filterStatus.insertAdjacentHTML('beforeend', `<option value="${v}">${esc(l)}</option>`);

      let all = [];

      async function load() {
        all = (await run(supabase.from('leads').select('*').order('created_at', { ascending: false }))) || [];
        render();
      }

      function render() {
        const q = search.value.trim().toLowerCase();
        const f = filterStatus.value;
        const list = all.filter(l => {
          if (f === '') { if (['zapisany', 'rezygnacja'].includes(l.status)) return false; }
          else if (f !== 'all' && l.status !== f) return false;
          if (q && !`${l.name} ${l.phone || ''} ${l.email || ''} ${l.instrument || ''} ${l.notes || ''}`.toLowerCase().includes(q)) return false;
          return true;
        });
        document.getElementById('countLabel').textContent = `${list.length} z ${all.length}`;
        rows.innerHTML = list.length ? list.map(l => `
          <tr data-id="${l.id}">
            <td><strong>${esc(l.name)}</strong><div class="mm-muted">${esc(l.phone || '')} ${l.email ? '· ' + esc(l.email) : ''}${l.student_age ? ' · ' + l.student_age + ' lat' : ''}</div>${l.notes ? `<div class="mm-muted">${esc(l.notes)}</div>` : ''}</td>
            <td>${esc(l.instrument || '')}<div class="mm-muted">${esc(l.preferred_days || '')}</div></td>
            <td>${esc(LABELS.lead_source[l.source] || l.source)}</td>
            <td><select class="mm-input" data-act="status">${options(LABELS.lead_status, l.status)}</select></td>
            <td><input type="date" class="mm-input" data-act="next" value="${l.next_action_at || ''}"></td>
            <td class="mm-muted" style="white-space:nowrap">${fmtDate(l.created_at)}</td>
            <td class="row-actions"><button class="mm-btn mm-btn--ghost mm-btn--sm" data-act="edit">Edytuj</button> <button class="mm-btn mm-btn--danger mm-btn--sm" data-act="del">Usuń</button></td>
          </tr>`).join('') : '<tr><td colspan="7" class="mm-empty">Brak leadów w tym widoku.</td></tr>';
      }

      rows.addEventListener('change', async (e) => {
        const tr = e.target.closest('tr'); const id = tr?.dataset.id; if (!id) return;
        if (e.target.dataset.act === 'status') {
          const status = e.target.value;
          const patch = { status, converted_at: status === 'zapisany' ? new Date().toISOString() : null };
          if (await run(supabase.from('leads').update(patch).eq('id', id).select().single(), 'Status zapisany')) await load();
        }
        if (e.target.dataset.act === 'next') {
          await run(supabase.from('leads').update({ next_action_at: nullIfEmpty(e.target.value) }).eq('id', id).select().single(), 'Termin zapisany');
        }
      });

      rows.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-act]'); if (!btn) return;
        const id = btn.closest('tr').dataset.id;
        const lead = all.find(l => l.id === id);
        if (btn.dataset.act === 'edit') {
          for (const [k, v] of Object.entries(lead)) { const el = form.elements[k]; if (el && el.type !== 'hidden') el.value = v ?? ''; }
          form.elements.id.value = id;
          document.getElementById('formTitle').textContent = `Edycja: ${lead.name}`;
          document.getElementById('saveBtn').textContent = 'Zapisz zmiany';
          document.getElementById('cancelEdit').hidden = false;
          form.scrollIntoView({ behavior: 'smooth' });
        }
        if (btn.dataset.act === 'del' && confirm(`Usunąć leada „${lead.name}”?`)) {
          if (await run(supabase.from('leads').delete().eq('id', id), 'Usunięto')) await load();
        }
      });

      function resetForm() {
        form.reset();
        form.elements.id.value = '';
        document.getElementById('formTitle').textContent = 'Nowy lead';
        document.getElementById('saveBtn').textContent = 'Dodaj leada';
        document.getElementById('cancelEdit').hidden = true;
      }
      document.getElementById('cancelEdit').addEventListener('click', resetForm);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const d = formData(form);
        const id = d.id; delete d.id;
        const payload = {
          name: d.name, phone: nullIfEmpty(d.phone), email: nullIfEmpty(d.email), instrument: nullIfEmpty(d.instrument),
          student_age: d.student_age ? Number(d.student_age) : null, source: d.source, status: d.status,
          next_action_at: nullIfEmpty(d.next_action_at), preferred_days: nullIfEmpty(d.preferred_days), notes: nullIfEmpty(d.notes),
        };
        const q = id ? supabase.from('leads').update(payload).eq('id', id) : supabase.from('leads').insert(payload);
        if (await run(q.select().single(), id ? 'Zapisano' : 'Lead dodany')) { resetForm(); await load(); }
      });

      search.addEventListener('input', render);
      filterStatus.addEventListener('change', render);
      await load();
    }
  </script>
</body>
</html>
